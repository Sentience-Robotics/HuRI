apiVersion: v1
kind: Service
metadata:
  name: {{ include "huri.fullname" . }}-head-dashboard-svc
  labels:
    {{- include "huri.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    ray.io/node-type: head
    ray.io/group: headgroup
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
