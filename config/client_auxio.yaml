huri_url: ws://localhost:8000/session

topic_list: [question]

senders:
  text:
    name: text

modules:
  mic:
    name: mic
    args:
      vad_agressiveness: 3
      silence_duration: 1.5
      block_duration: ${senders.audio.args.frame_duration}
    logging: INFO
  stt:
    name: stt
    args:
      language: en
      block_duration: ${senders.audio.args.frame_duration}
    logging: INFO
  tag:
    name: tag
    logging: INFO
