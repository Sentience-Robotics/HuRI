apiVersion: ray.io/v1
kind: RayService
metadata:
  name: {{ include "huri.fullname" . }}
  labels:
    {{- include "huri.labels" . | nindent 4 }}
  annotations:
    # Hard ceiling for the FIRST bring-up: if the Serve apps aren't ready within
    # this window the RayService enters a TERMINAL failure state, deletes the
    # RayCluster, and refuses to recreate it until the object is recreated. Cold
    # GPU bring-up on GCP (gpu-pool 0→1 scale-up + driver install + pulling the
    # large nvidia image) can exceed the old 20m, which is exactly what tripped
    # the terminal failure. Override via ray.initializingTimeout.
    ray.io/initializing-timeout: {{ .Values.ray.initializingTimeout | default "20m" | quote }}
spec:
  {{- if .Values.ray.serviceUnhealthySecondThreshold }}
  # How long the Serve *service* may stay unhealthy before the controller
  # recreates the RayCluster. Cold GPU bring-up (node provision + driver install
  # + large nvidia image pull) can take several minutes; the default is too short
  # and tears the cluster down mid-bootstrap (head + worker terminate together,
  # then the idle GPU node is reclaimed — an endless up/down loop).
  serviceUnhealthySecondThreshold: {{ .Values.ray.serviceUnhealthySecondThreshold }}
  {{- end }}
  {{- if .Values.ray.deploymentUnhealthySecondThreshold }}
  # Same idea, per individual Serve deployment (STT/TTS/Gesture wait on the GPU).
  deploymentUnhealthySecondThreshold: {{ .Values.ray.deploymentUnhealthySecondThreshold }}
  {{- end }}
  serveConfigV2: |
{{ .Values.ray.serveConfig | indent 4 }}
  rayClusterConfig:
    rayVersion: {{ .Values.ray.version | quote }}
    {{- if .Values.ray.enableInTreeAutoscaling }}
    # Layer ② — the Ray autoscaler turns Serve replica demand into worker-pod
    # demand, scaling workerGroupSpecs between their min/maxReplicas. Off unless
    # explicitly enabled in values, so single-GPU deployments stay pinned.
    enableInTreeAutoscaling: true
    {{- end }}

    headGroupSpec:
      serviceType: {{ .Values.head.serviceType }}
      rayStartParams:
        {{- toYaml .Values.head.rayStartParams | nindent 8 }}

      template:
        metadata:
          labels:
            {{- include "huri.selectorLabels" . | nindent 12 }}
        spec:
          {{- with .Values.head.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.head.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.head.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: ray-head
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              resources:
                {{- toYaml .Values.head.resources | nindent 16 }}

    workerGroupSpecs:
      {{- range .Values.workerGroups }}
      {{- $group := . }}
      - replicas: {{ .replicas }}
        minReplicas: {{ .minReplicas }}
        maxReplicas: {{ .maxReplicas }}
        groupName: {{ .groupName | quote }}
        rayStartParams:
          {{- toYaml .rayStartParams | nindent 10 }}
          {{- if .customResources }}
          resources: {{ .customResources | squote }}
          {{- end }}

        template:
          metadata:
            labels:
              {{- include "huri.selectorLabels" $ | nindent 14 }}
          spec:
            {{- if .hostIPC }}
            hostIPC: {{ .hostIPC }}
            {{- end }}
            {{- if .runtimeClassName }}
            # Tells containerd to invoke the nvidia/amd runtime, which mounts
            # the GPU devices into the pod. Required on WSL2 + k3s.
            runtimeClassName: {{ .runtimeClassName }}
            {{- end }}
            {{- if .podSecurityContext }}
            # Pod-level security: supplementalGroups, fsGroup, etc.
            securityContext:
              {{- toYaml .podSecurityContext | nindent 14 }}
            {{- end }}
            {{- with .nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .affinity }}
            affinity:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .tolerations }}
            tolerations:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: {{ .shmSize | default "1Gi" }}
              {{- if .cudaCacheHostPath }}
              - name: cuda-cache
                hostPath:
                  path: {{ .cudaCacheHostPath }}
                  type: DirectoryOrCreate
              {{- end }}
              {{- range .mountedModels }}
              {{- $model := index $.Values.models . }}
              {{- if $model.enabled }}
              - name: model-{{ . }}
                persistentVolumeClaim:
                  claimName: {{ include "huri.fullname" $ }}-{{ . }}-models
              {{- end }}
              {{- end }}
              {{- if and $.Values.voiceAssets.enabled .mountVoiceAssets }}
              - name: voice-assets
                persistentVolumeClaim:
                  claimName: {{ include "huri.fullname" $ }}-voice-assets
              {{- end }}
            containers:
              - name: ray-worker
                {{- if .image }}
                image: {{ .image }}
                {{- else }}
                image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
                {{- end }}
                imagePullPolicy: {{ $.Values.image.pullPolicy }}
                readinessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - wget --tries 1 -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz
                        | grep success
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 10
                  timeoutSeconds: 5
                env:
                  {{- $hasEnv := false }}
                  {{- if .containerEnv }}
                  {{- $hasEnv = true }}
                  {{- toYaml .containerEnv | nindent 18 }}
                  {{- end }}
                  {{- range .mountedModels }}
                  {{- $model := index $.Values.models . }}
                  {{- if and $model.enabled $model.env }}
                  {{- $hasEnv = true }}
                  {{- range $envKey, $envVal := $model.env }}
                  - name: {{ $envKey }}
                    value: {{ $envVal | quote }}
                  {{- end }}
                  {{- end }}
                  {{- end }}
                  {{- if and $.Values.voiceAssets.enabled $group.mountVoiceAssets }}
                  {{- range $envKey, $envVal := $.Values.voiceAssets.env }}
                  {{- $hasEnv = true }}
                  - name: {{ $envKey }}
                    value: {{ $envVal | quote }}
                  {{- end }}
                  {{- end }}
                  {{- if not $hasEnv }}
                  []
                  {{- end }}
                {{- if .securityContext }}
                # Container-level security: seLinuxOptions, capabilities, etc.
                securityContext:
                  {{- toYaml .securityContext | nindent 18 }}
                {{- end }}
                resources:
                  {{- toYaml .resources | nindent 18 }}
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
                  {{- if .cudaCacheHostPath }}
                  - name: cuda-cache
                    mountPath: /home/ray/.nv
                  {{- end }}
                  {{- range .mountedModels }}
                  {{- $model := index $.Values.models . }}
                  {{- if $model.enabled }}
                  - name: model-{{ . }}
                    mountPath: {{ $model.mountPath }}
                  {{- end }}
                  {{- end }}
                  {{- if and $.Values.voiceAssets.enabled .mountVoiceAssets }}
                  - name: voice-assets
                    mountPath: {{ $.Values.voiceAssets.mountPath }}
                  {{- end }}
      {{- end }}
