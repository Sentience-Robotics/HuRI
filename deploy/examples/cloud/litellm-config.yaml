# LiteLLM proxy config (rendered by templatefile() from litellm.tf).
#
# Exposes one OpenAI-compatible model alias, "huri-fast", that forwards to
# Anthropic's OpenAI-compatible API. The RAGHandle calls
# {llm_url}/v1/chat/completions with model="huri-fast" (llm_provider: vllm),
# and LiteLLM proxies to Anthropic (Claude).
#
# The Anthropic API key is injected via the MISTRAL_API_KEY env var (name kept
# for compatibility) from the litellm-secrets Kubernetes Secret — never stored
# in this file or in git.

model_list:
  - model_name: huri-fast
    litellm_params:
      # openai/ provider = generic OpenAI-compatible endpoint; api_base points
      # it at Anthropic's OpenAI-compatible /v1 API instead of api.openai.com.
      # LiteLLM POSTs to {api_base}/chat/completions, so the /v1 is required.
      model: openai/${model}
      api_base: https://api.anthropic.com/v1
      api_key: os.environ/MISTRAL_API_KEY

litellm_settings:
  # Drop params a given model doesn't support instead of erroring, so the
  # RAGHandle's OpenAI-style request body is always accepted.
  drop_params: true

general_settings:
  # Internal ClusterIP service — no virtual-key auth. Access is restricted at
  # the network layer (ClusterIP, same namespace), so requests need no bearer
  # token and the Mistral key stays solely in the Secret.
  master_key: null
