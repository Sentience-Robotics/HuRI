{{- if .Values.models.emotion.enabled }}
{{- $model := .Values.models.emotion }}
{{- $pvcName := printf "%s-emotion-models" (include "huri.fullname" .) }}
{{- if not (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $pvcName) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvcName }}
  labels:
    {{- include "huri.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml $model.pvc.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ $model.pvc.size }}
  {{- if $model.pvc.storageClassName }}
  storageClassName: {{ $model.pvc.storageClassName }}
  {{- end }}
{{- end }}
---
# Runs only on first install (not on upgrade) — model is already on the PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "huri.fullname" . }}-emotion-init
  labels:
    {{- include "huri.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "huri.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with $model.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $model.tolerations }}
      # Lets the download Job schedule onto a tainted node (e.g. a GPU node with
      # nvidia.com/gpu=present:NoSchedule) so the PVC binds in that node's zone —
      # required when the mounting worker is a GPU pod on a zonal RWO PVC.
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "huri.fullname" . }}-emotion-models
      containers:
        - name: emotion-downloader
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              MODEL_DIR="{{ $model.mountPath }}/{{ $model.modelSource.repoId }}"
              # config.json is the reliable presence marker for a HF transformers
              # repo (the weights file name varies: pytorch_model.bin / *.safetensors).
              if [ -f "$MODEL_DIR/config.json" ]; then
                echo "Model already present at $MODEL_DIR — skipping download."
                exit 0
              fi
              echo "Downloading {{ $model.modelSource.repoId }} into $MODEL_DIR …"
              pip install --quiet huggingface_hub
              python - <<'PYEOF'
              from huggingface_hub import snapshot_download
              snapshot_download(
                  "{{ $model.modelSource.repoId }}",
                  local_dir="{{ $model.mountPath }}/{{ $model.modelSource.repoId }}",
              )
              PYEOF
              echo "Download complete."
          volumeMounts:
            - name: models
              mountPath: {{ $model.mountPath }}
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
{{- end }}
