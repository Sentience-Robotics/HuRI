proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

logging_config:
  encoding: TEXT
  log_level: INFO
  logs_dir: null
  enable_access_log: true
  additional_log_standard_attrs: []

applications:
  - name: huri-app
    route_prefix: /
    import_path: src.app:app
    runtime_env: { RAY_COLOR_PREFIX=1 }
    deployments:
      - name: HuRI
      - name: RAGHandle
        num_replicas: 2
      - name: OllamaService
      - name: QdrantService
