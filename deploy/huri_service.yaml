apiVersion: ray.io/v1
kind: RayService
metadata:
  name: huri-service
  annotations:
    ray.io/initializing-timeout: "10m"
spec:
  # serveConfigV2 must be based on config/huri.yaml, or any other huri config
  serveConfigV2: |
    applications:
      - name: huri-app
        route_prefix: /
        import_path: src.app:app
        deployments:
          - name: HuRI

  rayClusterConfig:
    rayVersion: "2.52.0"

    headGroupSpec:
      serviceType: NodePort
      rayStartParams: {}

      template:
        spec:
          containers:
            - name: ray-head
              image: huri-ray-image:latest
              imagePullPolicy: IfNotPresent
              ports:
                - containerPort: 6379
                  name: gcs-server
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 8000
                  name: serve
              resources:
                limits:
                  cpu: "2"
                  memory: "5Gi"
                requests:
                  cpu: "2"
                  memory: "2Gi"

    workerGroupSpecs:
      - replicas: 1
        minReplicas: 1
        maxReplicas: 5
        groupName: small-group

        rayStartParams: {}

        template:
          spec:
            containers:
              - name: ray-worker
                image: huri-ray-image:latest
                imagePullPolicy: IfNotPresent
                resources:
                  limits:
                    cpu: "1"
                    memory: "2Gi"
                  requests:
                    cpu: "500m"
                    memory: "2Gi"
