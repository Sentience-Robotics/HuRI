proxy_location: EveryNode

http_options:
  host: 0.0.0.0
  port: 8000

logging_config:
  encoding: TEXT
  log_level: INFO
  logs_dir: null
  enable_access_log: true
  additional_log_standard_attrs: []

applications:
  - name: huri-app
    route_prefix: /
    import_path: src.app:app
    runtime_env: { RAY_COLOR_PREFIX=1 }
    deployments:
      - name: HuRI
      - name: STTHandle
        autoscaling_config:
          min_replicas: 1
          max_replicas: 5
          target_num_ongoing_requests_per_replica: 4
